name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  boundaries:
    name: Module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check module boundaries
        # Ubuntu: в образе уже есть PowerShell 7 (pwsh). На windows-latest по умолчанию
        # был бы Windows PowerShell 5.1 — пишем кроссплатформенно, без 5.1-специфики.
        shell: pwsh
        run: ./scripts/check-module-boundaries.ps1

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: boundaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        # bash gradlew: не зависим от executable-бита, который теряется при коммите
        # с Windows (core.filemode=false). Сам режим + LF чинятся в репозитории.
        shell: bash
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            core/*/build/reports/tests/
            feature/*/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  dependency-analysis:
    name: Dependency analysis
    runs-on: ubuntu-latest
    needs: boundaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run buildHealth
        shell: bash
        run: bash ./gradlew buildHealth --stacktrace

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-analysis-reports
          path: build/reports/dependency-analysis/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: boundaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Android lint
        shell: bash
        run: bash ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '*/build/reports/lint-results-debug.*'
          if-no-files-found: ignore
          retention-days: 7

  instrumented:
    name: Instrumented tests (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: boundaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: bash ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: '*/build/reports/androidTests/'
          if-no-files-found: ignore
          retention-days: 7
